apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

# 下面的 newTag 是 CI 唯一会回写的一行（.github/workflows/release-image.yml 用
# sed 匹配 `^    newTag: `）。缩进与「恰好出现一次」都由
# tests/unit/test_deploy_assets.py 守着——多一处或缩进变了，sed 会静默改错地方，
# 集群于是跑着一个 Git 里查不到的版本。
images:
  - name: ghcr.io/soft-zihan/mycode
    newName: ghcr.io/soft-zihan/mycode
    newTag: sha-e2bd65ce4c02eec0459aad6639e54eab62141e56

# images transformer 只改 image 字段，不改 env。沙箱镜像是从 MYCODE_SANDBOX_IMAGE
# 这个 env 读的，不同步就会出现「控制面升级了、沙箱还跑旧 commit」——端云不同版本
# 是最难查的一类故障，所以在这里把 image 值复制进那个 env。
replacements:
  - source:
      kind: Deployment
      name: control-plane
      fieldPath: spec.template.spec.containers.0.image
    targets:
      - select:
          kind: Deployment
          name: control-plane
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=MYCODE_SANDBOX_IMAGE].value
