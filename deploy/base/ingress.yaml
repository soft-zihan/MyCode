apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mycode
  namespace: mycode
  annotations:
    # MyCode 的事件流是单条 WebSocket 长连接，nginx ingress 默认 60s 读写超时
    # 会把它掐断——前端表现为「跑着跑着事件不再更新」。这不是防御性配置。
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # main.py 里 uvicorn 的 ws_max_size 是 10MB，ingress 默认 1m 会先拦住
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  rules:
    - host: mycode.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 80
    # 不写 host 的兜底规则：匹配任意 Host，于是宿主浏览器直接开
    # http://localhost:8080 就通，不用改 Windows 的 hosts（改 hosts 要管理员权限，
    # 是「从开机到能用」里唯一没法自动化的一步，去掉它才谈得上一键启动）。
    # 实测过没有这条时：curl localhost:8080/api/health → 404（nginx 默认后端），
    # 加 Host: mycode.local → 200。浏览器发不出自定义 Host 头，所以必须兜底。
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 80
