apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: mycode
  labels:
    app.kubernetes.io/name: mycode
    app.kubernetes.io/component: control-plane
spec:
  # 单副本：状态在 RWO PVC 上，多副本会争同一个卷。多副本是 C 批的事，
  # 前提是把会话后端换成 PostgreSQL 让控制面无状态。
  replicas: 1
  # 必须 Recreate 而不是 RollingUpdate：RWO 卷不能被两个 Pod 同时挂载，
  # 滚动更新时新 Pod 会一直卡在 Multi-Attach error 上。
  # 这个限制本身就是 C 批要做无状态化的动机。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mycode
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mycode
        app.kubernetes.io/component: control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001          # PVC 里的文件要能被 10001 写，靠它 chgrp
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          # deploy/kind 的 overlay 会用 images transformer 覆盖 tag；
          # CI 回写的就是那一行。这里绝不用 latest（ArgoCD 会认为无变化而不同步）。
          image: ghcr.io/soft-zihan/mycode:b1-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5555
          env:
            - name: MYCODE_HOST
              value: "0.0.0.0"          # auth.py 默认绑 127.0.0.1，Service 会转不进来
            # 全局状态根：~/.mycode/* 与 ~/.my-code/* 的解析统一收到这一个挂载点之下
            # （agents/core/state_root.py）。存算分离的那一刀就在这里——状态不落容器，
            # 计算（镜像）可以随便换。PVC 挂载点恰好等于数据区的历史默认，所以对已有的
            # 会话/工作区/快照/agent 定义一个字节都不动；真正被搬进 PVC 的是原先散在
            # emptyDir 上的配置区路径（projects 注册表、超大工具结果的溢出文件）——
            # 后者是改进：模型看到的「Full output saved to <path>」在 Pod 重建后仍然有效。
            # 代价是溢出文件从此不再有 Pod 生命周期兜底的清理，和会话事件一样只能靠
            # 5Gi 配额逼出人工清理；两者是同一类风险，没有引入新的种类。
            - name: MYCODE_HOME
              value: /home/app/.mycode
            - name: MYCODE_CONFIG_PATH
              value: /etc/mycode/config.json
            - name: MYCODE_SESSION_BACKEND
              value: jsonl
            # 派生产物要显式挡在 MYCODE_HOME 之外：venv 里的脚本把 shebang 写死成绝对
            # 路径，跟着 PVC 活过镜像升级之后，基底 Python 一换就是一堆看不懂的启动失败，
            # 而且它会无上限地吃 PVC 配额。钉回 emptyDir 等于保持今天的行为不变。
            - name: MYCODE_SKILL_VENV
              value: /home/app/.my-code/skill-venv
            - name: MYCODE_TRACING
              value: "0"                # B1 不接 Langfuse；要接就改 1 并补两个 key 的 env
            - name: XDG_CACHE_HOME
              value: /tmp/.cache        # 只读根下，第三方库的缓存要有地方落
            # 只有 git 走代理，不用全局 HTTPS_PROXY：Pod 直连 github.com:443 会超时，
            # 必须经宿主代理转发口出去（deploy/README.md §1.6 的四条对照实测）。
            # 但模型端点当前是直连可达的，全局代理会把所有出站都改道、平白多一个故障面，
            # 所以这里只把代理交给 git（agents/core/workspace_import.py 用
            # `git -c http.proxy=` 消费它）。网关地址是**每台机器不同的**，
            # 因此不写死在 base 里，由 scripts/cloud-up.sh 建 ConfigMap mycode-net 提供；
            # optional: true 让没建 ConfigMap 的环境（本地 dev、CI）照常渲染与启动。
            - name: MYCODE_GIT_PROXY
              valueFrom:
                configMapKeyRef:
                  name: mycode-net
                  key: git-proxy
                  optional: true
            - name: MYCODE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mycode-secrets
                  key: auth-token
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # startupProbe 给足预算：lifespan 里有崩溃恢复扫描与 MCP 连接（最长 30s 超时）
          startupProbe:
            httpGet: { path: /api/health, port: 5555 }
            periodSeconds: 2
            failureThreshold: 45        # 预算 90s
          livenessProbe:
            httpGet: { path: /api/health, port: 5555 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health, port: 5555 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi }
          volumeMounts:
            - name: config
              mountPath: /etc/mycode
              readOnly: true
            # HOME 整体给 emptyDir：MYCODE_HOME 已经收编了 .mycode / .my-code 两个根，
            # 但仍有两条写路径不归它管——用户级 agent skills（skills/skills.py:108 的
            # ~/.agents/skills）和 CLI 输入历史（cli/history.py:66 的 ~/.MYCODE_history.json）
            # 是直接 Path.home()/...，本来就该跟着用户主目录而不是全局状态根。
            # 逐个挂卷迟早漏一个，而只读根之下漏一个就是运行期 PermissionError。
            - name: home
              mountPath: /home/app
            # PVC 嵌套挂在 HOME 之下：kubelet 按路径深度排序挂载（先父后子），
            # 所以 MYCODE_HOME 指向的整个全局状态区能持久，而 HOME 其余部分
            # （.agents/skills、CLI 历史、skill-venv）仍是可丢弃的 emptyDir。
            - name: data
              mountPath: /home/app/.mycode
            - name: tmp
              mountPath: /tmp                   # PYTHONPYCACHEPREFIX 指到这里
      volumes:
        - name: config
          secret:
            secretName: mycode-config
        - name: home
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: mycode-data
        - name: tmp
          emptyDir: {}
